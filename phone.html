function ic(n){return '<svg viewBox="0 0 24 24">'+I[n]+'</svg>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('ts');e.textContent=t;e.hidden=false;clearTimeout(tmr);tmr=setTimeout(function(){e.hidden=true},4500)}
function fill(r){r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%')}
/* Home Assistant */
function st(t){$('st').textContent=t}
function snd(o,f){o.id=mid++;if(f)cb[o.id]=f;ws.send(JSON.stringify(o))}
function call(d,s,o){if(ws&&ws.readyState===1)snd({type:'call_service',domain:d,service:s,service_data:o})}
function first(p,g){var f;for(var x in ST)if(x.indexOf(p+'.')===0){if(g&&ST[x].attributes.device_class===g)return ST[x];f=f||ST[x]}return f}
function conn(){if(!C.u||!C.t)return;try{if(ws){ws.onclose=null;ws.close()}}catch(e){}st('Connecting…');
 try{ws=new WebSocket(C.u.replace(/\/$/,'').replace(/^http/,'ws')+'/api/websocket')}catch(e){st('Check the address');return}
 ws.onmessage=function(m){var d=JSON.parse(m.data);
  if(d.type==='auth_required')ws.send(JSON.stringify({type:'auth',access_token:C.t}));
  else if(d.type==='auth_ok'){st('Connected');snd({type:'get_states'},function(r){r.result.forEach(function(s){ST[s.entity_id]=s});sync()});snd({type:'subscribe_events',event_type:'state_changed'})}
  else if(d.type==='auth_invalid'){halt=1;st('That token wasn\u2019t accepted')}
  else if(d.type==='event'){var n=d.event.data.new_state;if(n){ST[n.entity_id]=n;sync()}}
  else if(d.id&&cb[d.id]){cb[d.id](d);delete cb[d.id]}};
 ws.onclose=function(){if(!halt)setTimeout(conn,5000)};ws.onerror=function(){st('Can\u2019t reach Home Assistant. It needs a remote-access address.')}}
function sync(){var l=first('lock'),a=first('alarm_control_panel'),c=first('climate'),g=first('cover','garage');
 if(l)S.lock=l.state==='locked';if(a)S.alarm=a.state.indexOf('armed')===0;
 if(c&&c.attributes.temperature!=null)S.temp=+c.attributes.temperature;
 if(g)S.garage=({open:'Open',closed:'Closed',opening:'Opening',closing:'Closing'})[g.state]||S.garage;R();camR()}
/* actions */
var ct;function setT(v,q){S.temp=Math.min(30,Math.max(16,v));R();save();clearTimeout(ct);ct=setTimeout(function(){var c=first('climate');if(c)call('climate','set_temperature',{entity_id:c.entity_id,temperature:S.temp})},q?0:500)}
function lockAll(on){S.lock=on;for(var x in ST)if(x.indexOf('lock.')===0)call('lock',on?'lock':'unlock',{entity_id:x})}
function alm(m){var a=first('alarm_control_panel');S.alarm=m!=='off';if(a)call('alarm_control_panel',m==='off'?'alarm_disarm':m==='night'?'alarm_arm_night':'alarm_arm_away',{entity_id:a.entity_id})}
function shut(){var g=first('cover','garage');if(g)call('cover','close_cover',{entity_id:g.entity_id});S.garage='Closed'}
var M={'Away':{s:'Lock, arm, eco climate',lock:1,al:'arm',t:17,off:1,gar:1},'Home':{s:'Alarm off, comfy',al:'off',t:21},'Night':{s:'Lock, arm, lights off',lock:1,al:'night',t:18,off:1},'Lights off':{s:'Every light off',off:1}},MI={'Away':'walk','Home':'home','Night':'moon','Lights off':'bulb'};
function setMode(n){var m=M[n];S.mode=n;if(m.lock)lockAll(true);if(m.al)alm(m.al);if(m.t!=null)setT(m.t,1);if(m.off)call('light','turn_off',{entity_id:'all'});if(m.gar&&S.garage!=='Closed')shut();save();R();toast(n==='Home'?'Welcome home \u00b7 alarm off':n+' mode on')}
function R(){$('tv').textContent=(S.temp%1?S.temp.toFixed(1):S.temp)+'\u00b0';$('rg').value=S.temp;fill($('rg'));
 $('pre').innerHTML=[['Cool',19],['Comfort',21],['Warm',23]].map(function(p){return '<button class="t'+(S.temp===p[1]?' on':'')+'" data-t="'+p[1]+'"><b>'+p[1]+'\u00b0</b><span>'+p[0]+'</span></button>'}).join('');
 $('md').innerHTML=Object.keys(M).map(function(n){return '<button class="t'+(S.mode===n?' on':'')+'" data-m="'+n+'">'+ic(MI[n])+'<span>'+n+'</span><small>'+M[n].s+'</small></button>'}).join('');
 $('sc').innerHTML=[['lock',S.lock,S.lock?'lock':'unlock','Doors<br>'+(S.lock?'Locked':'Unlocked')],['al',S.alarm,'shield','Alarm<br>'+(S.alarm?'On':'Off')],['gar',S.garage==='Closed','garage','Garage<br>'+S.garage]].map(function(x){return '<button class="t'+(x[1]?' on':'')+'" data-k="'+x[0]+'">'+ic(x[2])+'<span>'+x[3]+'</span></button>'}).join('')}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.s)setT(S.temp+ +b.dataset.s);
 else if(b.dataset.t)setT(+b.dataset.t,1);
 else if(b.dataset.m)setMode(b.dataset.m);
 else if(b.dataset.k==='lock'){if(S.lock&&!confirm('Unlock the doors?'))return;lockAll(!S.lock);R();save()}
 else if(b.dataset.k==='al'){if(S.alarm&&!confirm('Turn the alarm off?'))return;alm(S.alarm?'off':'arm');R();save()}
 else if(b.dataset.k==='gar'){if(S.garage==='Closed')toast('The garage is already closed');else{shut();R();save();toast('Closing the garage')}}});
$('rg').oninput=function(){setT(+this.value)};
/* themes + settings */
$('gr').onclick=function(){$('hu').value=C.u;$('ht').value=C.t;$('dg').showModal()};
$('cl').onclick=function(){$('dg').close()};
$('sv').onclick=function(){C.u=$('hu').value.trim();C.t=$('ht').value.trim();try{localStorage.setItem('ph-ha',JSON.stringify(C))}catch(e){}halt=0;if(C.u&&C.t)conn();else st('Not connected. Showing demo data.')};
function fit(){[$('app'),$('cams')].forEach(function(a){var av=a.parentNode.clientHeight,k=1;a.style.transform='';a.style.width='';a.style.minHeight='';
 for(var i=0;i<4;i++){var h=a.offsetHeight,nk=Math.min(1,av/h);if(Math.abs(nk-k)<.002)break;k=nk;a.style.transformOrigin='0 0';a.style.transform='scale('+k+')';a.style.width=(100/k)+'%'}
 a.style.minHeight=(av/k)+'px'})}

[].forEach.call($('dots').children,function(d,k){d.onclick=function(){pg.children[k].scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'})}});
